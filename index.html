<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Однорукий бандит</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2c3e50;
            font-family: Arial, sans-serif;
            color: #fff;
            padding: 20px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        #attemptText {
            font-size: 18px;
            margin-bottom: 15px;
            font-style: italic;
        }

        .gen-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: #2ed573;
            color: #fff;
            border: none;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .gen-btn:disabled {
            background: #7f8c8d;
        }
        .slot-machine {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #34495e;
            padding: 20px;
            border-radius: 15px;
            border: 5px solid #1a252f;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .slot-cell {
            width: 100px;
            height: 100px;
            background: #8e9eab;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slot-cell img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        .win-row {
            background: #2ed573 !important;
            box-shadow: 0 0 20px #2ed573;
        }
        @media (max-width: 480px) {
            .slot-cell {
                width: 70px;
                height: 70px;
            }
            .slot-machine {
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <h2 id="username">User</h2>
    <p id="attemptText">Спроба 0 з 3</p>
    <button id="genBtn" class="gen-btn">Generate</button>
    <div class="slot-machine" id="slotMachine"></div>
    <script src="Lr10.js"></script>
</body>
</html>
